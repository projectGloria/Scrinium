[package]
name = "scrinium"
version = "0.1.0"
description = "Read-only, fast desktop browser for your GitHub repositories"
edition = "2021"
rust-version = "1.85"

[lib]
name = "scrinium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "gzip", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
thiserror = "2"
nucleo-matcher = "0.3.1"
yaml-rust2 = "0.13.2"
base64 = "0.23.1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
