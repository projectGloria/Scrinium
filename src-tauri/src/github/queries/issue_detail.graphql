query IssueDetail($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    item: issueOrPullRequest(number: $number) {
      __typename
      ... on Issue {
        number
        title
        body
        state
        stateReason
        url
        createdAt
        updatedAt
        closedAt
        author { login avatarUrl }
        labels(first: 20) { nodes { name color } }
        comments(first: 100) { totalCount nodes { ...Comment } }
      }
      ... on PullRequest {
        number
        title
        body
        state
        isDraft
        url
        createdAt
        updatedAt
        closedAt
        mergedAt
        author { login avatarUrl }
        labels(first: 20) { nodes { name color } }
        comments(first: 100) { totalCount nodes { ...Comment } }
        headRefName
        baseRefName
        commits(last: 1) {
          nodes {
            commit {
              statusCheckRollup {
                state
                contexts(first: 50) {
                  nodes {
                    __typename
                    ... on CheckRun { name status conclusion detailsUrl }
                    ... on StatusContext { context state targetUrl }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment Comment on IssueComment {
  id
  author { login avatarUrl }
  body
  createdAt
}
