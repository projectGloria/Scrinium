query RepoRefs($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) {
    branches: refs(refPrefix: "refs/heads/", first: 100, orderBy: { field: TAG_COMMIT_DATE, direction: DESC }) {
      totalCount
      nodes { name target { ...Commitish } }
    }
    tags: refs(refPrefix: "refs/tags/", first: 100, orderBy: { field: TAG_COMMIT_DATE, direction: DESC }) {
      totalCount
      nodes { name target { ...Commitish ... on Tag { target { ...Commitish } } } }
    }
  }
}

fragment Commitish on Commit {
  oid
  committedDate
  tree { oid }
}
